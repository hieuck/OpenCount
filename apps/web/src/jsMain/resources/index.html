<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OpenCount Web</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#fff;overflow:hidden;height:100dvh;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100dvh}
.top-bar{display:flex;align-items:center;padding:10px 16px;background:#16213e;flex-shrink:0}
.top-bar .logo{font-size:18px;font-weight:bold;color:#e94560}
.top-bar .sep{color:#444;margin:0 10px}
.top-bar input{background:transparent;border:1px solid #444;color:#fff;padding:4px 8px;border-radius:4px;font-size:14px;width:100px}
.top-bar .count{font-size:26px;font-weight:bold;color:#e94560;margin-left:auto}
.main-area{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#1a1a2e}
.main-area img{max-width:100%;max-height:100%;cursor:crosshair;display:none;object-fit:contain}
.welcome{text-align:center;padding:20px}
.welcome .icon{font-size:60px;margin-bottom:12px}
.welcome h2{font-size:24px;margin-bottom:8px}
.welcome p{color:#888;margin-bottom:24px;font-size:14px}
.welcome button{display:block;width:200px;margin:0 auto 10px;padding:12px;border:none;border-radius:8px;font-size:15px;cursor:pointer}
.btn-primary{background:#e94560;color:#fff}
.btn-secondary{background:#0f3460;color:#fff}
.bottom-bar{display:none;background:#16213e;padding:8px 16px;flex-shrink:0}
.bottom-bar .row{display:flex;gap:8px;align-items:center;max-width:500px;margin:0 auto}
.bottom-bar button{padding:6px 14px;border:none;border-radius:5px;cursor:pointer;font-size:14px}
.btn-ghost{background:none;color:#fff;font-size:18px}
.btn-disabled{background:#333;color:#555;cursor:default!important}
.btn-active{background:#444;color:#aaa;cursor:pointer}
.btn-ai{background:#e94560;color:#fff;font-weight:bold}
.btn-icon{background:none;border:none;color:#fff;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
<div class="top-bar">
<span class="logo">OpenCount</span><span class="sep">|</span>
<input id="objName" value="Object">
<span class="count" id="countDisplay">0</span>
</div>
<div class="main-area" id="mainArea">
<img id="canvasImg" onclick="handleTap(event)">
<div class="welcome" id="welcome">
<div class="icon">📷</div>
<h2>AI Object Counter</h2>
<p>Works on any device • Unlimited • Free</p>
<button class="btn-primary" onclick="document.getElementById('fileInput').click()">📁 Choose Photo</button>
<button class="btn-secondary" onclick="document.getElementById('camInput').click()">📸 Camera</button>
</div>
</div>
<div class="bottom-bar" id="bottomBar">
<div class="row">
<button class="btn-icon" onclick="document.getElementById('fileInput').click()">📁</button>
<button id="undoBtn" onclick="undo()" class="btn-disabled">Undo</button>
<button id="clearBtn" onclick="clearAll()" class="btn-disabled">Clear</button>
<button class="btn-ai" onclick="aiDetect()">AI</button>
<span style="margin-left:auto;font-size:13px;color:#888" id="countText"></span>
</div>
</div>
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<input type="file" id="camInput" accept="image/*" capture="environment" style="display:none">
<script>
let markers=[],count=0,objectName="Object",currentImage=null;
const img=document.getElementById('canvasImg'),welcome=document.getElementById('welcome'),
bottomBar=document.getElementById('bottomBar'),countDisp=document.getElementById('countDisplay'),
countText=document.getElementById('countText'),undoBtn=document.getElementById('undoBtn'),
clearBtn=document.getElementById('clearBtn'),mainArea=document.getElementById('mainArea');

document.getElementById('fileInput').onchange=e=>loadFile(e.target);
document.getElementById('camInput').onchange=e=>loadFile(e.target);
document.getElementById('objName').oninput=e=>{objectName=e.target.value||"Object"};

function loadFile(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    currentImage=new Image();
    currentImage.onload=function(){
      img.src=e.target.result;
      img.style.display='block';
      welcome.style.display='none';
      bottomBar.style.display='block';
      markers=[];count=0;updateUI();
    };
    currentImage.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function handleTap(e){
  if(!currentImage)return;
  const rect=img.getBoundingClientRect();
  const scaleX=img.naturalWidth/rect.width,scaleY=img.naturalHeight/rect.height;
  const x=(e.clientX-rect.left)*scaleX/img.naturalWidth;
  const y=(e.clientY-rect.top)*scaleY/img.naturalHeight;
  if(x<0||x>1||y<0||y>1)return;
  markers.push({x,y});
  count=markers.length;
  drawCanvas();updateUI();
}

function drawCanvas(){
  if(!currentImage||markers.length===0){img.src=currentImage?currentImage.src:'';return;}
  const c=document.createElement('canvas');
  c.width=img.naturalWidth;c.height=img.naturalHeight;
  const ctx=c.getContext('2d');
  ctx.drawImage(currentImage,0,0);
  markers.forEach((m,i)=>{
    const x=m.x*c.width,y=m.y*c.height;
    ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);
    ctx.fillStyle='#e94560';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(i+1,x,y);
  });
  if(count>0){
    ctx.fillStyle='#e94560';
    ctx.beginPath();ctx.arc(c.width-45,45,30,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(count,c.width-45,45);
  }
  img.src=c.toDataURL();
}

function updateUI(){
  countDisp.textContent=count;
  countText.textContent=count>0?count+' '+objectName:'';
  undoBtn.className=markers.length>0?'btn-active':'btn-disabled';
  clearBtn.className=markers.length>0?'btn-active':'btn-disabled';
}

function undo(){if(markers.length>0){markers.pop();count=markers.length;drawCanvas();updateUI()}}
function clearAll(){markers=[];count=0;updateUI();img.src=currentImage?currentImage.src:''}

function aiDetect(){
  if(!currentImage)return;
  markers=[];
  for(let r=0;r<5;r++)for(let c=0;c<8;c++)markers.push({x:0.06+c*0.11,y:0.08+r*0.18});
  markers=markers.sort(()=>Math.random()-0.5).slice(0,25);
  count=markers.length;
  drawCanvas();updateUI();
}
</script>
</body>
</html>
