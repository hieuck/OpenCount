name: KMP CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'packages/**'
      - 'apps/android/**'
      - 'apps/desktop/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-check:
    name: Shared Module (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run shared module tests
        run: ./gradlew :packages:shared:desktopTest --no-daemon
      - name: Build shared module
        run: ./gradlew :packages:shared:build --no-daemon

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Android debug APK
        run: ./gradlew :apps:android:assembleDebug --no-daemon

  desktop-build:
    name: Desktop Build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build desktop app
        run: ./gradlew :apps:desktop:compileKotlinDesktop --no-daemon
