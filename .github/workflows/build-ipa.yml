name: Build iOS IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Download YOLOv3 Model
      run: |
        cd Scripts && chmod +x download_model.sh && ./download_model.sh

    - name: Build Archive
      run: |
        cd OpenCount_iOS
        xcodebuild -project OpenCount.xcodeproj \
          -scheme OpenCount \
          -configuration Release \
          -derivedDataPath build \
          -sdk iphoneos \
          -arch arm64 \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          archive -archivePath build/OpenCount.xcarchive

    - name: Export IPA
      run: |
        cd OpenCount_iOS
        xcodebuild -exportArchive \
          -archivePath build/OpenCount.xcarchive \
          -exportOptionsPlist ExportOptions.plist \
          -exportPath build/ \
          -allowProvisioningUpdates

    - name: Verify IPA Created
      run: |
        if [ -f "OpenCount_iOS/build/OpenCount.ipa" ]; then
          echo "✅ IPA created successfully"
          ls -lh OpenCount_iOS/build/OpenCount.ipa
        else
          echo "❌ IPA not found"
          exit 1
        fi

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: OpenCount-IPA
        path: OpenCount_iOS/build/OpenCount.ipa
        retention-days: 7