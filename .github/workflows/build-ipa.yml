name: Build IPA (Unsigned — Sideloadly / AltStore)

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Optional version suffix (e.g. beta1)"
        required: false
        default: ""
  push:
    tags:
      - "v*"
    branches:
      - master

env:
  SCHEME: OpenCount
  DERIVED_DATA: ${{ github.workspace }}/.build/DerivedData
  IPA_DIR: ${{ github.workspace }}/.build/IPA
  XCODE_VERSION: "16.2"

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.build/DerivedData/SourcePackages
            ~/.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install tools
        run: brew install xcodegen xcbeautify || true

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Debug available destinations
        run: |
          echo "=== All runtimes ==="
          xcrun simctl list runtimes 2>&1 || true
          echo ""
          echo "=== Available simulators ==="
          xcrun simctl list devices available 2>&1 | head -40
          echo ""
          echo "=== xcodebuild show destinations ==="
          xcodebuild -project OpenCount.xcodeproj -scheme OpenCount -showdestinations 2>&1 | head -60 || true

      - name: Find simulator UDID
        id: sim
        run: |
          # Extract first available iPhone simulator UDID
          UDID=$(xcrun simctl list devices available 2>&1 | grep -E "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          echo "UDID found: '$UDID'"
          if [ -z "$UDID" ]; then
            echo "ERROR: No iPhone simulator UDID found. Exiting."
            exit 1
          fi
          echo "udid=$UDID" >> $GITHUB_OUTPUT

      - name: Build .app
        run: |
          set -o pipefail
          echo "Building for UDID: ${{ steps.sim.outputs.udid }}"
          xcodebuild \
            -project OpenCount.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            SUPPORTS_MACCATALYST=NO \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | xcbeautify --renderer github-actions; exit ${PIPESTATUS[0]}

      - name: Locate .app
        id: app
        run: |
          APP=$(find "$DERIVED_DATA" -name "OpenCount.app" -not -path "*/SourcePackages/*" | grep -v "Tests" | head -1)
          echo "app_path=$APP" >> $GITHUB_OUTPUT
          echo "Found: $APP"
          ls -la "$APP" || true

      - name: Package IPA
        run: |
          APP="${{ steps.app.outputs.app_path }}"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP" "$IPA_DIR/Payload/OpenCount.app"
          cd "$IPA_DIR"
          zip -r OpenCount-unsigned.ipa Payload
          ls -lh OpenCount-unsigned.ipa

      - name: Compute version
        id: version
        run: |
          SHA=$(git rev-parse --short HEAD)
          TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
          VER="${TAG:-dev-$SHA}"
          SUFFIX="${{ github.event.inputs.version_suffix }}"
          [ -n "$SUFFIX" ] && VER="$VER-$SUFFIX"
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Rename IPA
        run: |
          mv "$IPA_DIR/OpenCount-unsigned.ipa" \
             "$IPA_DIR/OpenCount-${{ steps.version.outputs.version }}-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenCount-IPA-${{ steps.version.outputs.version }}
          path: ${{ env.IPA_DIR }}/OpenCount-*.ipa
          retention-days: 90

      - name: Done
        run: echo "IPA built successfully! Download from Actions Artifacts tab above."
