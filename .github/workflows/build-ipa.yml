# ─────────────────────────────────────────────────────────────────────────────
# Build IPA — Development signing for AltStore / Sideloadly
#
# Triggered manually (workflow_dispatch) or on version tags (v*).
#
# Required GitHub Secrets:
#   BUILD_CERTIFICATE_BASE64   — base64-encoded .p12 development certificate
#   P12_PASSWORD               — password for the .p12 file
#   BUILD_PROVISION_PROFILE_BASE64 — base64-encoded .mobileprovision
#   KEYCHAIN_PASSWORD          — any strong password for the temp keychain
#   DEVELOPMENT_TEAM           — your 10-char Apple Team ID (e.g. ABC1234567)
#
# How to get these (free Apple ID path):
#   1. Open Xcode → Preferences → Accounts → add your Apple ID
#   2. Xcode auto-creates a development certificate in Keychain Access
#   3. Export it: Keychain Access → My Certificates → right-click → Export
#      Save as .p12, set a password → that's BUILD_CERTIFICATE_BASE64 + P12_PASSWORD
#   4. In Xcode, build once for a connected device → Xcode creates a provisioning profile
#      Find it at ~/Library/MobileDevice/Provisioning Profiles/ → that's BUILD_PROVISION_PROFILE_BASE64
#   5. DEVELOPMENT_TEAM: Xcode → project settings → Signing & Capabilities → Team ID
#
# The resulting IPA is uploaded as a GitHub Actions artifact.
# Download it, then use AltStore or Sideloadly to install on your iPhone.
# ─────────────────────────────────────────────────────────────────────────────
name: Build IPA (AltStore / Sideloadly)

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Optional version suffix (e.g. beta1)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

env:
  SCHEME: OpenCount
  CONFIGURATION: Release
  DERIVED_DATA: ${{ github.workspace }}/.build/DerivedData
  ARCHIVE_PATH: ${{ github.workspace }}/.build/OpenCount.xcarchive
  EXPORT_PATH: ${{ github.workspace }}/.build/IPA
  XCODE_VERSION: "16.2"
  KEYCHAIN_NAME: build-keychain

jobs:
  build-ipa:
    name: Archive & Export IPA
    runs-on: macos-15

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Select Xcode ─────────────────────────────────────────────────────────
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      # ── Cache SPM ────────────────────────────────────────────────────────────
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.build/DerivedData/SourcePackages
            ~/.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # ── Install XcodeGen ─────────────────────────────────────────────────────
      - name: Install tools (xcodegen, xcbeautify)
        run: brew install xcodegen xcbeautify

      # ── Generate Xcode project ───────────────────────────────────────────────
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      # ── Install signing certificate ──────────────────────────────────────────
      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Decode certificate
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          # Create a temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

          # Import certificate into keychain
          security import "$CERT_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_NAME"

          # Allow codesign to access the keychain
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_NAME"

          # Make it the default keychain
          security list-keychain -d user -s "$KEYCHAIN_NAME"

      # ── Install provisioning profile ─────────────────────────────────────────
      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          # Copy to the standard location Xcode looks in
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      # ── Archive ──────────────────────────────────────────────────────────────
      - name: Archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          set -o pipefail
          xcodebuild \
            -project OpenCount.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Automatic \
            archive \
          | xcbeautify --renderer github-actions

      # ── Export IPA ───────────────────────────────────────────────────────────
      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates

      # ── Compute version string ───────────────────────────────────────────────
      - name: Compute version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
          if [ -n "$TAG" ]; then
            VERSION="$TAG"
          else
            VERSION="dev-${SHORT_SHA}"
          fi
          SUFFIX="${{ github.event.inputs.version_suffix }}"
          if [ -n "$SUFFIX" ]; then
            VERSION="${VERSION}-${SUFFIX}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "IPA version: $VERSION"

      # ── Rename IPA ───────────────────────────────────────────────────────────
      - name: Rename IPA
        run: |
          IPA_FILE=$(find "$EXPORT_PATH" -name "*.ipa" | head -1)
          mv "$IPA_FILE" "$EXPORT_PATH/OpenCount-${{ steps.version.outputs.version }}.ipa"

      # ── Upload IPA artifact ──────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenCount-IPA-${{ steps.version.outputs.version }}
          path: ${{ env.EXPORT_PATH }}/OpenCount-*.ipa
          retention-days: 30

      # ── Upload dSYMs for crash symbolication ─────────────────────────────────
      - name: Upload dSYMs
        uses: actions/upload-artifact@v4
        with:
          name: OpenCount-dSYMs-${{ steps.version.outputs.version }}
          path: ${{ env.ARCHIVE_PATH }}/dSYMs/
          retention-days: 30

      # ── Cleanup keychain ─────────────────────────────────────────────────────
      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_NAME" || true

      # ── Print install instructions ───────────────────────────────────────────
      - name: Install instructions
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅  IPA built: OpenCount-${{ steps.version.outputs.version }}.ipa"
          echo ""
          echo "  To install on your iPhone:"
          echo ""
          echo "  Option A — AltStore (recommended, free):"
          echo "    1. Install AltStore on your iPhone: https://altstore.io"
          echo "    2. Download the IPA from the Actions artifacts tab"
          echo "    3. Open AltStore → My Apps → + → select the IPA"
          echo "    4. Re-sign every 7 days (free Apple ID limit)"
          echo ""
          echo "  Option B — Sideloadly:"
          echo "    1. Install Sideloadly on your Mac/PC: https://sideloadly.io"
          echo "    2. Connect iPhone via USB"
          echo "    3. Drag the IPA into Sideloadly and click Start"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
