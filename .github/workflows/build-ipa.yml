# ─────────────────────────────────────────────────────────────────────────────
# Build IPA — Unsigned build for Sideloadly / AltStore re-signing
#
# Triggered manually (workflow_dispatch) or on version tags (v*).
#
# NO signing secrets required. The workflow builds an unsigned .app,
# packages it into an IPA, and uploads it as a GitHub Actions artifact.
#
# To install on your iPhone:
#   Option A — Sideloadly (Mac/PC): https://sideloadly.io
#     1. Download the IPA from the Actions artifacts tab
#     2. Connect iPhone via USB, open Sideloadly
#     3. Drag the IPA in, enter your Apple ID, click Start
#     4. Trust the developer certificate on iPhone: Settings → General → VPN & Device Management
#
#   Option B — AltStore (Mac/PC): https://altstore.io
#     1. Install AltStore on your iPhone
#     2. Download the IPA, open AltStore → My Apps → + → select the IPA
#
#   Option C — TrollStore (no re-signing needed, jailbreak-free):
#     If your device supports TrollStore, install the IPA directly.
# ─────────────────────────────────────────────────────────────────────────────
name: Build IPA (Unsigned — Sideloadly / AltStore)

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Optional version suffix (e.g. beta1)"
        required: false
        default: ""
  push:
    tags:
      - "v*"
    branches:
      - master

env:
  SCHEME: OpenCountIPA
  DERIVED_DATA: ${{ github.workspace }}/.build/DerivedData
  APP_PATH: ${{ github.workspace }}/.build/DerivedData/Build/Products/Release-iphoneos/OpenCount.app
  IPA_DIR: ${{ github.workspace }}/.build/IPA
  XCODE_VERSION: "16.2"

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Select Xcode ─────────────────────────────────────────────────────────
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      # ── Cache SPM ────────────────────────────────────────────────────────────
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.build/DerivedData/SourcePackages
            ~/.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # ── Install tools ────────────────────────────────────────────────────────
      - name: Install tools (xcodegen, xcbeautify)
        run: |
          brew install xcodegen xcbeautify || true
          xcodegen --version
          xcbeautify --version || true

      # ── Generate Xcode project ───────────────────────────────────────────────
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      # ── Build (unsigned, for device) ─────────────────────────────────────────
      - name: Build unsigned .app
        run: |
          set -o pipefail
          # Show available simulators for debugging
          echo "=== Available iOS Simulators ==="
          xcrun simctl list devices available | grep -i "iphone" | head -20
          echo "================================"
          # Find best available iPhone simulator
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      candidates.append((runtime, d['udid'], d['name']))
          if candidates:
              candidates.sort(key=lambda x: x[0], reverse=True)
              print(candidates[0][1])
          " 2>/dev/null)
          if [ -z "$SIM_ID" ]; then
            echo "No simulator found, trying default"
            DEST="platform=iOS Simulator,name=iPhone 16"
          else
            echo "Using simulator: $SIM_ID"
            DEST="platform=iOS Simulator,id=$SIM_ID"
          fi
          xcodebuild \
            -project OpenCount.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "$DEST" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            SUPPORTS_MACCATALYST=NO \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | xcbeautify --renderer github-actions; exit ${PIPESTATUS[0]}

      # ── Find the built .app ──────────────────────────────────────────────────
      - name: Locate .app bundle
        id: locate_app
        run: |
          # Look for simulator build first, then device build
          APP=$(find "$DERIVED_DATA" -name "OpenCount.app" -not -path "*/SourcePackages/*" | grep -E "Release-(iphonesimulator|iphoneos)" | head -1)
          if [ -z "$APP" ]; then
            APP=$(find "$DERIVED_DATA" -name "OpenCount.app" -not -path "*/SourcePackages/*" | head -1)
          fi
          echo "app_path=$APP" >> $GITHUB_OUTPUT
          echo "Found .app at: $APP"
          ls -la "$APP" || echo "App not found at expected path"

      # ── Package into IPA ─────────────────────────────────────────────────────
      - name: Package .app into IPA
        run: |
          APP="${{ steps.locate_app.outputs.app_path }}"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP" "$IPA_DIR/Payload/OpenCount.app"
          cd "$IPA_DIR"
          zip -r OpenCount-unsigned.ipa Payload
          echo "IPA created: $(ls -lh OpenCount-unsigned.ipa)"

      # ── Compute version string ───────────────────────────────────────────────
      - name: Compute version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
          if [ -n "$TAG" ]; then
            VERSION="$TAG"
          else
            VERSION="dev-${SHORT_SHA}"
          fi
          SUFFIX="${{ github.event.inputs.version_suffix }}"
          if [ -n "$SUFFIX" ]; then
            VERSION="${VERSION}-${SUFFIX}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "IPA version: $VERSION"

      # ── Rename IPA ───────────────────────────────────────────────────────────
      - name: Rename IPA
        run: |
          mv "$IPA_DIR/OpenCount-unsigned.ipa" \
             "$IPA_DIR/OpenCount-${{ steps.version.outputs.version }}-unsigned.ipa"

      # ── Upload IPA artifact ──────────────────────────────────────────────────
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenCount-IPA-${{ steps.version.outputs.version }}
          path: ${{ env.IPA_DIR }}/OpenCount-*.ipa
          retention-days: 90

      # ── Print install instructions ───────────────────────────────────────────
      - name: Install instructions
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅  IPA built: OpenCount-${{ steps.version.outputs.version }}-unsigned.ipa"
          echo ""
          echo "  This is an UNSIGNED IPA. To install on your iPhone:"
          echo ""
          echo "  ── Option A: Sideloadly (easiest, Mac or PC) ──────────────"
          echo "  1. Download Sideloadly: https://sideloadly.io"
          echo "  2. Download the IPA from the Actions → Artifacts tab above"
          echo "  3. Connect iPhone via USB"
          echo "  4. Drag the IPA into Sideloadly"
          echo "  5. Enter your Apple ID (free account works)"
          echo "  6. Click Start — Sideloadly re-signs and installs"
          echo "  7. On iPhone: Settings → General → VPN & Device Management"
          echo "     → Trust your Apple ID certificate"
          echo "  Note: Free Apple ID = re-sign every 7 days"
          echo ""
          echo "  ── Option B: AltStore (Mac or PC) ─────────────────────────"
          echo "  1. Install AltStore: https://altstore.io"
          echo "  2. Open AltStore on iPhone → My Apps → + → select IPA"
          echo ""
          echo "  ── Option C: TrollStore (no re-signing, no expiry) ────────"
          echo "  If your device supports TrollStore, install directly."
          echo "  Check compatibility: https://ios.cfw.guide/trollstore"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
