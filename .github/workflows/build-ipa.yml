name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Download YOLOv3 Model
      run: |
        cd Scripts
        chmod +x download_model.sh
        ./download_model.sh

    - name: Build iOS App
      run: |
        cd OpenCount_iOS
        xcodebuild -scheme OpenCount \
          -configuration Release \
          -derivedDataPath build \
          -arch arm64 \
          -sdk iphoneos \
          build

    - name: Create IPA
      run: |
        cd OpenCount_iOS/build
        mkdir -p Payload
        cp -r build/Release-iphoneos/OpenCount.app Payload/
        zip -r OpenCount.ipa Payload/

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: OpenCount-IPA
        path: OpenCount_iOS/build/OpenCount.ipa
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: OpenCount_iOS/build/OpenCount.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
