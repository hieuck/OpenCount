# ─────────────────────────────────────────────────────────────────────────────
# CI — Build & Test on iOS Simulator
#
# Runs on every push and pull request.
# No code signing required — builds for Simulator only.
# ─────────────────────────────────────────────────────────────────────────────
name: CI — Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: OpenCount
  SIMULATOR_DESTINATION: "platform=iOS Simulator,name=iPhone 16,OS=latest"
  DERIVED_DATA: ${{ github.workspace }}/.build/DerivedData
  XCODE_VERSION: "16.2"

jobs:
  build-and-test:
    name: Build & Test (Simulator)
    runs-on: macos-15

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Select Xcode version ─────────────────────────────────────────────────
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      # ── Cache SPM packages ───────────────────────────────────────────────────
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.build/DerivedData/SourcePackages
            ~/.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # ── Install tools ────────────────────────────────────────────────────────
      - name: Install tools (xcbeautify, xcodegen)
        run: |
          brew install xcodegen xcbeautify

      # ── Generate Xcode project ───────────────────────────────────────────────
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      # ── Boot Simulator ───────────────────────────────────────────────────────
      - name: Boot iPhone 16 Simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if 'iPhone 16' in d['name'] and d['isAvailable']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build (Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project OpenCount.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -parallelizeTargets \
            CODE_SIGNING_ALLOWED=NO \
            build \
          | xcbeautify --renderer github-actions

      # ── Test ─────────────────────────────────────────────────────────────────
      - name: Test (Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project OpenCount.xcodeproj \
            -scheme "$SCHEME" \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "${{ github.workspace }}/.build/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test \
          | xcbeautify --renderer github-actions

      # ── Upload test results ──────────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ github.run_number }}
          path: ${{ github.workspace }}/.build/TestResults.xcresult
          retention-days: 14
