# ─────────────────────────────────────────────────────────────────────────────
# CI — Build & Test
# Builds for iOS Simulator. Downloads iOS platform if not present.
# ─────────────────────────────────────────────────────────────────────────────
name: CI — Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: OpenCount
  DERIVED_DATA: ${{ github.workspace }}/.build/DerivedData
  XCODE_VERSION: "16.2"

jobs:
  build-and-test:
    name: Build & Test (Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.build/DerivedData/SourcePackages
            ~/.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install tools
        run: brew install xcodegen xcbeautify || true

      - name: Download iOS platform
        run: |
          # Download iOS 18 simulator runtime if not already present
          xcodebuild -downloadPlatform iOS 2>/dev/null || true
          # List available simulators
          xcrun simctl list runtimes

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Find simulator destination
        id: sim
        run: |
          # Try iPhone 16 first, fall back to any available iPhone simulator
          DEST=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          best = None
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime and 'com.apple.CoreSimulator.SimRuntime.iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      if best is None or 'iPhone 16' in d['name']:
                          best = d
          if best:
              print(f\"platform=iOS Simulator,id={best['udid']}\")
          else:
              print('platform=iOS Simulator,name=iPhone 15,OS=latest')
          " 2>/dev/null || echo "platform=iOS Simulator,name=iPhone 15,OS=latest")
          echo "destination=$DEST" >> $GITHUB_OUTPUT
          echo "Using destination: $DEST"

      - name: Build (Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project OpenCount.xcodeproj \
            -scheme "$SCHEME" \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            SUPPORTS_MACCATALYST=NO \
            build \
          | xcbeautify --renderer github-actions || \
          xcodebuild \
            -project OpenCount.xcodeproj \
            -scheme "$SCHEME" \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            SUPPORTS_MACCATALYST=NO \
            build

      - name: Run Tests (Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project OpenCount.xcodeproj \
            -scheme "$SCHEME" \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$DERIVED_DATA/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SUPPORTS_MACCATALYST=NO \
            test \
          | xcbeautify --renderer github-actions || \
          xcodebuild \
            -project OpenCount.xcodeproj \
            -scheme "$SCHEME" \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$DERIVED_DATA/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SUPPORTS_MACCATALYST=NO \
            test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuildResults-${{ github.run_number }}
          path: ${{ env.DERIVED_DATA }}
          retention-days: 7
